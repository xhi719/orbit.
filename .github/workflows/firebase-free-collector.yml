name: ORBIT official news collector (Firebase Spark)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collection scope
        type: choice
        options: [incremental, backfill, content-backfill, reverify]
        default: backfill
      seed:
        description: Seed candidate catalogue and disabled reviewed sources
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '53 4 * * *'
permissions:
  contents: read
concurrency:
  group: orbit-firebase-spark-collector
  cancel-in-progress: false
jobs:
  collector:
    # Standard public-repository runners are free. Private repositories are
    # deliberately excluded to avoid exceeding their monthly free minutes.
    if: ${{ !github.event.repository.private && vars.ORBIT_FIREBASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      ORBIT_FIREBASE_APPLY: 'true'
      ORBIT_FIREBASE_SPARK_CONFIRMED: ${{ vars.ORBIT_FIREBASE_SPARK_CONFIRMED }}
      ORBIT_FIREBASE_NOTIFICATIONS_ENABLED: ${{ vars.ORBIT_FIREBASE_NOTIFICATIONS_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/firebase/requirements.txt
      - name: Seed only when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
        run: python services/firebase/collector.py --seed --apply
      - name: Apply approved requests and process queued account deletion
        id: admin_requests
        continue-on-error: true
        run: python services/firebase/admin.py --apply
      - name: Fetch bounded publisher announcements
        shell: bash
        run: |
          MODE=incremental
          if [[ "${{ github.event.schedule }}" == '53 4 * * *' ]]; then MODE=reverify; fi
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then MODE='${{ inputs.mode }}'; fi
          python services/firebase/collector.py --mode "$MODE" --hours 72 --max-sources 100 --pages-per-source 3 --live --apply --report reports/firebase-collector.json
      - name: Report publication and holding outcomes
        id: collection_report
        if: always()
        shell: bash
        env:
          ADMIN_REQUESTS_OUTCOME: ${{ steps.admin_requests.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("reports/firebase-collector.json")
          dispatch_allowed = False
          if os.environ.get("ADMIN_REQUESTS_OUTCOME") == "failure":
              print("::warning::Administrative request processing failed; collection is inspected separately.")
          if not path.exists():
              print(json.dumps({"publicationPipeline": "NO_COLLECTION_REPORT", "instruction": "Inspect the collection step failure", "fullSourceCoverageVerified": False}))
          else:
              report = json.loads(path.read_text(encoding="utf-8"))
              dispatch_allowed = not report.get("providerQuotaBlocked", False) and report.get("status") not in ("PROVIDER_QUOTA_DEFERRED", "FAILED") and not str(report.get("status", "")).startswith("DEFERRED")
              results = report.get("results", [])
              summary = {key: report.get(key) for key in ["status", "backend", "recordedAt", "sourceAttempts", "registeredSourcesConsidered", "unattemptedSources", "newsOutcome", "quotaPolicy", "fullSourceCoverageVerified"]}
              summary["createdDocuments"] = sum(row.get("metrics", {}).get("created", 0) for row in results)
              summary["updatedDocuments"] = sum(row.get("metrics", {}).get("updated", 0) for row in results)
              summary["sourceOutcomes"] = {status: sum(row.get("status") == status for row in results) for status in sorted({row.get("status", "UNKNOWN") for row in results})}
              print(json.dumps({"publicationPipeline": summary}, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("dispatch_allowed=" + str(dispatch_allowed).lower() + "\n")
          PY
      - name: Dispatch enabled FCM notifications
        if: ${{ success() && steps.collection_report.outputs.dispatch_allowed == 'true' }}
        run: python services/firebase/notifications.py --apply
    # No artifact upload/cache/billing attachment, Functions, Cloud Run, Cloud
    # Scheduler, App Hosting or Cloud Storage is created by this workflow.
